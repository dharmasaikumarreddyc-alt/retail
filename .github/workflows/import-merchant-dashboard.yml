name: Import merchant dashboard

on:
  push:
    branches:
      - feature/merchant-dashboard

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Bootstrap merchant integration workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Harshini merchant feature commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add merchant-source https://github.com/harshini-602/Ai_Mavericks.git
          git fetch merchant-source 43f1b588a09c049ee340e95a41d2d491d1529df9
          git cherry-pick 43f1b588a09c049ee340e95a41d2d491d1529df9
          git push origin HEAD:feature/merchant-dashboard
