name: Validate exact Cloud Run deployment

on:
  push:
    branches:
      - deploy/cloud-run-exact

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact Next.js container
        run: docker build --build-arg NEXT_PUBLIC_BACKEND_URL=https://backend.example.test -t aisle-web-test .
      - name: Build FastAPI container
        run: docker build -t aisle-api-test ./backend
