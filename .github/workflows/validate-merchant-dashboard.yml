name: Validate merchant dashboard integration

on:
  push:
    branches:
      - feature/merchant-dashboard

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate merchant integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Next.js frontend
        run: npm run build

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend Python
        run: python -m compileall -q backend
