name: Deploy Loopora Web to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: loopora-web-production
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: project-08a199a1-b3a6-4e7d-b5f
  FRONTEND_SERVICE: loopora-web
  FRONTEND_REGION: asia-south1
  RUNTIME_SERVICE_ACCOUNT: aisle-runner@project-08a199a1-b3a6-4e7d-b5f.iam.gserviceaccount.com
  NEXT_PUBLIC_BACKEND_URL: https://loopora-api-c23fcesjzq-el.a.run.app

jobs:
  deploy:
    name: Build, deploy, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node tests/catalog-regression.cjs
          npm run build

      - name: Deploy existing Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --source . \
            --region "${FRONTEND_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --quiet

          gcloud run services update-traffic "${FRONTEND_SERVICE}" \
            --region "${FRONTEND_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --to-latest \
            --quiet

      - name: Verify live routes
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_URL="$(gcloud run services describe "${FRONTEND_SERVICE}" \
            --region "${FRONTEND_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(status.url)')"
          FRONTEND_REVISION="$(gcloud run services describe "${FRONTEND_SERVICE}" \
            --region "${FRONTEND_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(status.latestReadyRevisionName)')"

          for route in / /shop /cart-pilot /login /merchant/login; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "${FRONTEND_URL}${route}" >/dev/null
          done

          {
            echo "### Loopora web deployment"
            echo "- URL: ${FRONTEND_URL}"
            echo "- Revision: ${FRONTEND_REVISION}"
            echo "- Routes checked: /, /shop, /cart-pilot, /login, /merchant/login"
          } >> "${GITHUB_STEP_SUMMARY}"
