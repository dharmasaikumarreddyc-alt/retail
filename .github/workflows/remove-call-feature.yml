name: Remove Call Feature

on:
  push:
    branches:
      - remove/call-feature

permissions:
  contents: write

jobs:
  remove-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove/call-feature
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Remove outbound call feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/cart-pilot/CartPilotClient.tsx')
          text = path.read_text()

          state_start = '  // Bland.ai demo call\n'
          state_end = '  // Geolocation / radius\n'
          if state_start not in text or state_end not in text:
              raise SystemExit('Could not locate call state/function block')
          start = text.index(state_start)
          end = text.index(state_end, start)
          text = text[:start] + text[end:]

          ui_start = '                      {/* Bland.ai demo call'
          ui_end = '                      {/* Voice diagnostics'
          if ui_start not in text or ui_end not in text:
              raise SystemExit('Could not locate call UI block')
          start = text.index(ui_start)
          end = text.index(ui_end, start)
          text = text[:start] + text[end:]

          path.write_text(text)
          PY

          git rm app/api/agents/call/route.ts

          if grep -R -n -E 'Bland\.ai|BLAND_API_KEY|BLAND_DEMO_PHONE|/api/agents/call|Get a Demo Call|84990' app --exclude-dir=.next; then
            echo 'Call feature references still remain under app/'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit removal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/cart-pilot/CartPilotClient.tsx app/api/agents/call/route.ts
          git commit -m 'Remove outbound demo call feature'
          git push origin HEAD:remove/call-feature
